services:
  postgres:
    image: postgres:16-alpine
    container_name: go_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trans-pulse_db
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_restore:
    image: postgres:16
    environment:
      POSTGRES_DB: trans-pulse_db_restore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    secrets:
      - db_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

secrets:
  db_password:
    file: ../.config/db_password.txt

volumes:
  postgres_data:

# Полный стек одной командой (нужен только Docker): PostgreSQL + MongoDB + REST API.
#   bash scripts/init_env.sh && docker compose -f docker-compose.app.yml up -d --build --wait
# Все секреты берутся из .env (создаётся скриптом init_env.sh со случайными значениями, в git не попадает).
# Контейнеры без фиксированных имён, порты для хоста настраиваются в .env: конфликтов с уже запущенными БД не будет.
name: trans-pulse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?запустите scripts/init_env.sh, чтобы создать .env}
      POSTGRES_DB: trans-pulse_api
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trans-pulse_api"]
      interval: 3s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?запустите scripts/init_env.sh, чтобы создать .env}
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-57017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/trans-pulse_api?sslmode=disable
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-trans_pulse}
      JWT_SECRET: ${JWT_SECRET:?запустите scripts/init_env.sh, чтобы создать .env}
      JWT_TTL: ${JWT_TTL:-1h}
      HTTP_ADDR: ":8080"
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Тесты и эксперименты внутри контейнера (профиль tools, по умолчанию не запускается):
  #   docker compose -f docker-compose.app.yml --profile tools run --rm --build tests
  tests:
    profiles: ["tools"]
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/trans-pulse_api?sslmode=disable
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      API_TEST_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/trans-pulse_api_test?sslmode=disable
      API_TEST_MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
    command: >
      sh -c 'goose -dir migrations postgres "$$API_TEST_DATABASE_URL" up
      && go test -count=1 ./internal/...'

volumes:
  pg_data:
  mongo_data:
